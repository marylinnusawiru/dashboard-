<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Dashboard · Mathilde</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: "DM Sans", sans-serif; background: #f2ede7; color: #2d2720; min-height: 100vh; padding-bottom: 80px; }
  :root {
    --bg: #f2ede7; --card: #faf7f4; --border: #e0d8cf;
    --navy: #1a2f4e; --navy-dark: #0f1f35;
    --text: #2d2720; --text2: #4a3f36; --muted: #8a7e74; --subtle: #a89e94;
    --beige2: #ede8e1; --beige3: #f5f0eb;
    --green: #2e7d32; --red: #c0392b;
  }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
  .btn-navy { background: linear-gradient(135deg, var(--navy), var(--navy-dark)); color: #fff; border: none; border-radius: 12px; padding: 14px 16px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 7px; font-family: "DM Sans", sans-serif; }
  .btn-ghost { background: var(--beige2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--navy); font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-family: "DM Sans", sans-serif; }
  .sec { margin: 16px 14px 0; }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .mcard { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 13px 11px; display: flex; flex-direction: column; gap: 5px; }
  .mcard-val { font-size: 21px; font-weight: 800; color: var(--text); font-family: "DM Mono", monospace; line-height: 1; }
  .mcard-lbl { font-size: 10px; color: var(--subtle); letter-spacing: 0.07em; text-transform: uppercase; font-weight: 600; }
  .mcard-sub { font-size: 12px; color: var(--muted); }
  .tag { background: #dce3f0; border: 1px solid #b0bdd4; border-radius: 6px; padding: 2px 8px; font-size: 11px; color: var(--navy); font-weight: 500; }
  .rcard { background: #eef1f8; border: 1px solid #c5cee0; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .ccard { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 13px 15px; margin-bottom: 8px; }
  .pill-nav { display: flex; gap: 4px; background: var(--beige3); padding: 8px 14px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab-btn { padding: 7px 13px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--muted); white-space: nowrap; font-family: "DM Sans", sans-serif; }
  .tab-btn.active { background: var(--navy); color: #fff; }
  input, textarea { background: var(--beige2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 14px; width: 100%; outline: none; font-family: "DM Sans", sans-serif; }
  textarea { resize: vertical; min-height: 70px; }
  .news-card { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; border-left: 3px solid var(--navy); border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .news-card.urgent { border-left-color: #ef4444; }
  .news-card.info { border-left-color: var(--subtle); }
  .impact-box { font-size: 12px; color: var(--muted); background: #f2ede7; border-radius: 8px; padding: 6px 10px; border-left: 2px solid var(--navy); margin-top: 6px; }
  .filter-btn { padding: 6px 13px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; white-space: nowrap; font-family: "DM Sans", sans-serif; }
  .badge { font-size: 10px; font-weight: 700; border-radius: 6px; padding: 2px 7px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- HEADER -->

<div id="header" style="background:#f5f0eb;border-bottom:1px solid #e0d8cf;padding:22px 20px 18px;">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;">
    <div style="flex:1;">
      <div id="hdr-date" style="font-size:22px;font-weight:700;color:var(--navy);letter-spacing:-0.02em;line-height:1.2;"></div>
      <div id="hdr-sub" style="font-size:13px;color:#9c8e82;margin-top:4px;font-family:'DM Mono',monospace;"></div>
    </div>
    <svg id="weather-svg" width="90" height="70" viewBox="0 0 90 70" style="flex-shrink:0;margin-left:12px;border-radius:12px;"></svg>
  </div>
  <div style="display:flex;gap:9px;">
    <div id="pill-meteo" style="display:flex;align-items:center;gap:7px;background:#ede8e1;border-radius:10px;padding:9px 13px;border:1px solid #d9cfc5;flex:1;"></div>
    <div id="pill-velo" style="display:flex;align-items:center;gap:7px;border-radius:10px;padding:9px 13px;flex:1;"></div>
  </div>
</div>

<!-- TABS -->

<div class="pill-nav">
  <button class="tab-btn active" onclick="showTab('ia')">✨ IA</button>
  <button class="tab-btn" onclick="showTab('trajet')">🚴 Trajet</button>
  <button class="tab-btn" onclick="showTab('aujourd')">Aujourd'hui</button>
  <button class="tab-btn" onclick="showTab('actu')">📰 Actu</button>
  <button class="tab-btn" onclick="showTab('labo')">🧪 Labo</button>
</div>

<!-- IA TAB -->

<div id="tab-ia">
  <div class="sec">
    <div class="lbl">✨ Bilan IA personnalisé</div>
    <div id="insights-area">
      <button class="btn-navy" onclick="genInsights()">✨ Générer mon bilan du jour</button>
    </div>
  </div>
  <div class="sec" style="margin-top:18px;">
    <div class="lbl">🍽️ Idées dîner · Adaptées à votre journée</div>
    <div id="recettes-area">
      <button class="btn-navy" onclick="genRecettes()" style="background:linear-gradient(135deg,#2a4a7f,#1a2f4e);">🍽️ Suggérer des recettes pour ce soir</button>
    </div>
  </div>
</div>

<!-- TRAJET TAB -->

<div id="tab-trajet" class="hidden">
  <div class="sec">
    <div class="lbl">🚴 Trajet · Météo climatologique</div>
    <div class="card" id="trajet-card"></div>
  </div>
</div>

<!-- AUJOURD'HUI TAB -->

<div id="tab-aujourd" class="hidden">
  <div class="sec">
    <div class="lbl">📋 Bilan matinal</div>
    <div id="matin-area"></div>
  </div>
</div>

<!-- ACTU TAB -->

<div id="tab-actu" class="hidden">
  <div class="sec">
    <div id="actu-date" class="lbl"></div>
    <div style="display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;" id="news-filters"></div>
    <div id="actu-area">
      <button class="btn-navy" onclick="loadNews()">📰 Charger l'actualité du jour</button>
    </div>
  </div>
</div>

<!-- LABO TAB -->

<div id="tab-labo" class="hidden">
  <div id="labo-area" style="padding-bottom:20px;"></div>
</div>

// ── CLOCK ────────────────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const mo = now.getMonth()+1;
  document.getElementById("hdr-date").textContent =
    now.toLocaleDateString("fr-CH",{weekday:"long",day:"numeric",month:"long"});
  document.getElementById("hdr-sub").textContent =
    now.toLocaleTimeString("fr-CH",{hour:"2-digit",minute:"2-digit"}) + " · Mathilde Droz-Bartholet";

  // Weather SVG
  const tempsMois=[1,2,5,9,14,17,19,19,15,10,5,2];
  const pluieMois=[55,50,55,60,65,60,55,55,60,65,60,55];
  const baseTemp=tempsMois[mo-1], prob=pluieMois[mo-1];
  const isNight=h<6||h>21, isRainy=prob>60, isSnowy=baseTemp<2;
  const skyTop=isNight?"#1a2f4e":isRainy?"#7a8fa6":"#a8c5da";
  const skyBot=isNight?"#2d4a6b":isRainy?"#9aafc4":"#c8dfe8";
  const hill1=isNight?"#0f1f35":"#2d5a3d", hill2=isNight?"#1a2f4e":"#3d7a52";

  let svgContent = `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${skyTop}"/><stop offset="100%" stop-color="${skyBot}"/>
  </linearGradient></defs>
  <rect width="90" height="70" rx="12" fill="url(#sky)"/>
  <ellipse cx="20" cy="65" rx="35" ry="20" fill="${hill1}"/>
  <ellipse cx="70" cy="68" rx="40" ry="18" fill="${hill2}"/>
  <polygon points="55,42 50,55 60,55" fill="#1a3d28"/>
  <polygon points="55,36 48,48 62,48" fill="#1a3d28"/>
  <polygon points="68,46 64,57 72,57" fill="#1a3d28"/>
  <polygon points="68,40 62,52 74,52" fill="#1a3d28"/>`;

  if (!isRainy && !isSnowy) {
    svgContent += isNight
      ? `<path d="M15,18 Q22,12 28,18 Q22,24 15,18Z" fill="#f0e6a0" opacity="0.9"/>`
      : `<circle cx="72" cy="16" r="10" fill="#f5c842" opacity="0.9"/>`;
  }
  if (isRainy) svgContent += `
    <ellipse cx="30" cy="20" rx="18" ry="10" fill="#fff" opacity="0.7"/>
    <ellipse cx="44" cy="18" rx="14" ry="9" fill="#fff" opacity="0.6"/>
    <ellipse cx="62" cy="22" rx="16" ry="9" fill="#fff" opacity="0.65"/>
    <line x1="28" y1="32" x2="25" y2="40" stroke="#7ab0cc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="38" y1="30" x2="35" y2="38" stroke="#7ab0cc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="48" y1="32" x2="45" y2="40" stroke="#7ab0cc" stroke-width="1.5" stroke-linecap="round"/>`;
  if (isSnowy) svgContent += `
    <ellipse cx="35" cy="18" rx="20" ry="10" fill="#fff" opacity="0.8"/>
    <circle cx="22" cy="38" r="2" fill="#fff" opacity="0.7"/>
    <circle cx="42" cy="34" r="2" fill="#fff" opacity="0.7"/>
    <circle cx="62" cy="38" r="2" fill="#fff" opacity="0.7"/>`;
  if (isNight) svgContent += `
    <circle cx="20" cy="12" r="1" fill="#fff" opacity="0.8"/>
    <circle cx="40" cy="8" r="1.2" fill="#fff" opacity="0.9"/>
    <circle cx="55" cy="14" r="0.8" fill="#fff" opacity="0.7"/>
    <circle cx="70" cy="9" r="1" fill="#fff" opacity="0.8"/>`;

  document.getElementById("weather-svg").innerHTML = svgContent;

  // Pills
  const wico = prob>65?"🌧️":prob>50?"🌦️":baseTemp<3?"❄️":"⛅";
  document.getElementById("pill-meteo").innerHTML = `
    <span style="font-size:20px">${wico}</span>
    <div>
      <div style="font-size:14px;font-weight:700;color:var(--text)">${baseTemp}°C · ${prob}% pluie</div>
      <div style="font-size:11px;color:#9c8e82">Langnau am Albis</div>
    </div>`;

  const veloOk = prob<65 && baseTemp>2;
  const matin_ = h<12;
  const pv = document.getElementById("pill-velo");
  pv.style.background = veloOk?"#e8f5e9":"#fdf0ee";
  pv.style.border = `1px solid ${veloOk?"#c8e6c9":"#f5c6bb"}`;
  pv.innerHTML = `
    <span style="font-size:20px">${veloOk?"🚴":"🚌"}</span>
    <div>
      <div style="font-size:14px;font-weight:700;color:${veloOk?"var(--green)":"var(--red)"}">${veloOk?"Vélo OK":"Transport"}</div>
      <div style="font-size:11px;color:#9c8e82">${matin_?"Aller 06h30":"Retour 18h00"}</div>
    </div>`;

  // Actu date
  const ad = document.getElementById("actu-date");
  if(ad) ad.textContent = "📰 Actualité · " + now.toLocaleDateString("fr-CH",{weekday:"long",day:"numeric",month:"long"});
}
setInterval(updateClock, 1000);
updateClock();

// ── TABS ─────────────────────────────────────────────────────────────────────
function showTab(name) {
  ["ia","trajet","aujourd","actu","labo"].forEach(t => {
    document.getElementById("tab-"+t).classList.add("hidden");
  });
  document.getElementById("tab-"+name).classList.remove("hidden");
  document.querySelectorAll(".tab-btn").forEach((b,i) => {
    const tabs=["ia","trajet","aujourd","actu","labo"];
    b.classList.toggle("active", tabs[i]===name);
  });
  if(name==="trajet") renderTrajet();
  if(name==="aujourd") renderMatin();
  if(name==="labo") renderLabo();
}

// ── MÉTÉO TRAJET ──────────────────────────────────────────────────────────────
function renderTrajet() {
  const now = new Date(), mo=now.getMonth()+1, h=now.getHours();
  const tempsMois=[1,2,5,9,14,17,19,19,15,10,5,2];
  const pluieMois=[55,50,55,60,65,60,55,55,60,65,60,55];
  const baseTemp=tempsMois[mo-1], prob=pluieMois[mo-1];
  const pluieMm = prob>60?1.2:prob>50?0.5:0.1;

        <div style="font-size:17px;font-weight:800;margin-top:4px">${baseTemp}°C</div>

        <div style="font-size:11px;color:#3b82f6;margin-top:4px">${(pluieMm*2).toFixed(1)}mm/j</div>
      </div>
      <div style="background:var(--beige2);border-radius:11px;padding:11px;border:1px solid var(--border)">
        <div style="font-size:10px;color:var(--subtle);font-weight:700;text-transform:uppercase;margin-bottom:5px">🏢 Arrivée</div>
        <div style="font-size:24px">${wico}</div>
        <div style="font-size:17px;font-weight:800;margin-top:4px">${baseTemp+2}°C</div>
        <div style="font-size:11px;color:var(--muted)">Zürich Europaallee</div>
        <div style="font-size:11px;color:#3b82f6;margin-top:4px">${(pluieMm*1.5).toFixed(1)}mm/j</div>
      </div>
    </div>
    <div style="background:${veloOk?"#e8f5e9":"#fdf0ee"};border:1.5px solid ${veloOk?"#c8e6c9":"#f5c6bb"};border-radius:12px;padding:13px 15px;display:flex;align-items:center;gap:11px;margin-bottom:12px">
      <span style="font-size:24px">${veloOk?"🚴":"🚌"}</span>
      <div>
        <div style="font-weight:700;font-size:14px;color:${veloOk?"var(--green)":"var(--red)"}">${veloOk?"✅ À vélo toute la journée !":"🚌 Transports recommandés"}</div>

// ── IA INSIGHTS ──────────────────────────────────────────────────────────────
function genInsights() {
const td=todayData(), last30=G90.slice(-30);
const avgSteps=Math.round(last30.reduce((a,d)=>a+(d.steps||0),0)/last30.length);
const hrVals=last30.filter(d=>d.restingHR).map(d=>d.restingHR);
const avgHR=hrVals.length?Math.round(hrVals.reduce((a,v)=>a+v,0)/hrVals.length):null;
const conseils=[];

if((td.bbHigh||0)<50) conseils.push({icon:“⚡”,titre:“Body Battery faible”,conseil:`BB max ${td.bbHigh}% aujourd'hui. Priorité à la récupération ce soir — couchez-vous avant 22h.`});
else if((td.bbHigh||0)>=80) conseils.push({icon:“💪”,titre:“Bonne énergie”,conseil:`BB max ${td.bbHigh}% — vous pouvez vous permettre une séance GA1 (FC 108-118 bpm).`});

const steps=td.steps||0;
if(steps<5000) conseils.push({icon:“👟”,titre:“Peu de mouvement”,conseil:`${fmtSteps(steps)} pas seulement. Une courte marche de 20 min ce soir aiderait.`});
else if(steps>=7160) conseils.push({icon:“✅”,titre:“Objectif pas atteint”,conseil:`${fmtSteps(steps)} pas — objectif 7'160 atteint ! Votre trajet vélo y contribue.`});
else conseils.push({icon:“👟”,titre:“Quasi à l’objectif”,conseil:`${fmtSteps(steps)} pas sur 7'160. Une courte sortie complèterait la journée.`});

if((td.stress||0)>50) conseils.push({icon:“🧘”,titre:“Stress élevé”,conseil:`Niveau ${td.stress}/100. 10 min de respiration ou Pilates aideraient avant de dormir.`});
else if((td.stress||0)<30) conseils.push({icon:“😌”,titre:“Bonne gestion du stress”,conseil:`Stress à ${td.stress}/100 — excellente journée. Bon moment pour s'entraîner.`});

if(avgHR && td.restingHR) {
if(td.restingHR>avgHR+3) conseils.push({icon:“❤️”,titre:“FC repos élevée”,conseil:`FC repos ${td.restingHR} bpm (moy: ${avgHR}). Signe de fatigue — réduisez l'intensité.`});
else if(td.restingHR<=avgHR-2) conseils.push({icon:“❤️”,titre:“Excellente récupération”,conseil:`FC repos ${td.restingHR} bpm, sous votre moyenne (${avgHR}). Corps bien récupéré.`});
}

const area=document.getElementById(“insights-area”);
area.innerHTML = conseils.slice(0,4).map(c=>` <div class="ccard"> <div style="display:flex;gap:10px"> <span style="font-size:18px;flex-shrink:0">${c.icon}</span> <div> <div style="font-weight:700;font-size:14px;margin-bottom:3px;color:var(--navy)">${c.titre}</div> <div style="font-size:13px;color:var(--text2);line-height:1.6">${c.conseil}</div> </div> </div> </div>`).join(””) +
`<button class="btn-ghost" style="width:100%;justify-content:center;margin-top:4px" onclick="genInsights()">↻ Régénérer</button>`;
}

        <div style="display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:${i<LABO.zones.length-1?"1px solid var(--border)":"none"}">
          <div style="width:33px;height:25px;border-radius:6px;background:${z.bg};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#1a2332;flex-shrink:0">${z.n}</div>
          <div style="flex:1">
            <div style="font-size:13px;font-weight:700;color:var(--navy)">FC ${z.fcMin}–${z.fcMax===999?"max":z.fcMax} bpm</div>
            <div style="font-size:11px;color:var(--muted)">${z.wMin}–${z.wMax===999?"max":z.wMax} W · ${z.dur}</div>
          </div>
        </div>`).join("")}
      <div style="margin-top:10px;padding:9px 12px;background:#fff7ed;border-radius:9px;border:1px solid #fed7aa;font-size:11px;color:#9a3412">💡 Zone brûle-graisses max : FC 100–110 bpm (81–100 W). Course à pied : +10 bpm.</div>
    </div>
  </div>
  <div style="margin:14px 14px 0">
    <div class="lbl">🩸 Courbe lactate</div>
    <div class="card">
      <table style="width:100%;font-size:12px;border-collapse:collapse">
        <thead><tr style="border-bottom:2px solid var(--border)">
          <th style="padding:4px 7px;text-align:left;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase">Watt</th>
          <th style="padding:4px 7px;text-align:left;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase">FC</th>
          <th style="padding:4px 7px;text-align:left;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase">Lactate</th>
        </tr></thead>
        <tbody>${LABO.lactate.map((r,i)=>`
          <tr style="background:${r.w===200?"#fff7ed":r.w===120?"#f0fdf4":"transparent"};border-bottom:1px solid var(--border)">
            <td style="padding:5px 7px;font-weight:700;color:var(--navy);font-family:'DM Mono',monospace">${r.w}W${r.w===120?" ← VT1":r.w===200?" ← VT2 🔴":""}</td>
            <td style="padding:5px 7px;color:#ef4444;font-family:'DM Mono',monospace">${r.fc}</td>
            <td style="padding:5px 7px;color:${r.l>=4?"#ef4444":r.l>=2?"#f59e0b":"#16a34a"};font-weight:${r.l>=2?700:400};font-family:'DM Mono',monospace">${r.l} mmol/L</td>
          </tr>`).join("")}
        </tbody>
      </table>
      <div class="g2" style="margin-top:10px">
        <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:9px;padding:9px 11px">
          <div style="font-size:11px;font-weight:700;color:#15803d">Seuil 2 mmol/L</div>
          <div style="font-size:16px;font-weight:800;font-family:'DM Mono',monospace;margin-top:2px">135 W</div>
          <div style="font-size:11px;color:var(--muted)">FC 125 · 65% max</div>
        </div>
        <div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:9px;padding:9px 11px">
          <div style="font-size:11px;font-weight:700;color:#c2410c">Seuil 4 mmol/L</div>
          <div style="font-size:16px;font-weight:800;font-family:'DM Mono',monospace;margin-top:2px">166 W</div>
          <div style="font-size:11px;color:var(--muted)">FC 144 · 81% max</div>
        </div>
      </div>
    </div>
  </div>
  <div style="margin:14px 14px 0">
    <div class="lbl">📋 Recommandation · Dr Lamprecht</div>
    <div class="card">
      <div style="font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:12px">VO2max exzellent (42 mL/min/kg). Excellent métabolisme aérobie. Maintenir GA1 (FC 108–118). Ajouter 1–2 sessions fettverbrennung 60–120 min sur home-trainer. Votre trajet vélo Langnau → Europaallee est exactement dans la bonne zone.</div>
      <div class="g2">
        ${[{e:"🚴",t:"Trajet vélo au travail",s:"Zone GA1 — parfait"},{e:"🏠",t:"Home-trainer 60-120 min",s:"Zone GA1 · 1-2×/sem"},{e:"🤸",t:"Pilates",s:"1×/semaine"},{e:"🤿",t:"Plongée rebreather",s:"Objectif principal"}].map(x=>`
          <div style="background:var(--bg);border-radius:9px;padding:9px 11px;display:flex;gap:7px;align-items:flex-start">
            <span style="font-size:17px;flex-shrink:0">${x.e}</span>
            <div>
              <div style="font-size:12px;font-weight:700;color:var(--navy)">${x.t}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:1px">${x.s}</div>
            </div>
          </div>`).join("")}
      </div>
    </div>
  </div>`;
}
</script>
</body>
</html>
