<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"DM Sans",sans-serif;background:#f2ede7;color:#2d2720;padding-bottom:80px}
:root{--bg:#f2ede7;--card:#faf7f4;--bd:#e0d8cf;--navy:#1a2f4e;--navy2:#0f1f35;--t1:#2d2720;--t2:#4a3f36;--mu:#8a7e74;--su:#a89e94;--b2:#ede8e1;--b3:#f5f0eb}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.btn{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;width:100%;font-family:"DM Sans",sans-serif;display:flex;align-items:center;justify-content:center;gap:7px}
.ghost{background:var(--b2);border:1px solid var(--bd);border-radius:10px;padding:9px 14px;color:var(--navy);font-size:13px;font-weight:600;cursor:pointer;font-family:"DM Sans",sans-serif}
.sec{margin:16px 14px 0}
.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px 11px}
.mv{font-size:21px;font-weight:800;color:var(--t1);font-family:"DM Mono",monospace;line-height:1}
.ml{font-size:10px;color:var(--su);letter-spacing:.07em;text-transform:uppercase;font-weight:600;margin-top:4px}
.ms{font-size:12px;color:var(--mu);margin-top:2px}
.tag{background:#dce3f0;border:1px solid #b0bdd4;border-radius:6px;padding:2px 8px;font-size:11px;color:var(--navy);font-weight:500}
.rc{background:#eef1f8;border:1px solid #c5cee0;border-radius:14px;padding:14px;margin-bottom:10px}
.cc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 15px;margin-bottom:8px}
.nav{display:flex;gap:4px;background:var(--b3);padding:8px 14px;border-bottom:1px solid var(--bd);overflow-x:auto}
.tb{padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--mu);white-space:nowrap;font-family:"DM Sans",sans-serif}
.tb.on{background:var(--navy);color:#fff}
input,textarea{background:var(--b2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;color:var(--t1);font-size:14px;width:100%;outline:none;font-family:"DM Sans",sans-serif}
textarea{resize:vertical;min-height:65px}
.nc{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--bd);border-left:3px solid var(--navy)}
.nc.u{border-left-color:#ef4444}
.nc.i{border-left-color:var(--su)}
.ib{font-size:12px;color:var(--mu);background:var(--bg);border-radius:8px;padding:6px 10px;border-left:2px solid var(--navy);margin-top:6px}
.fb{padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:"DM Sans",sans-serif}
.hid{display:none!important}
</style>
</head>

function st(n){
